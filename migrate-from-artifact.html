<!doctype html>
<html><head><meta charset="utf-8"><title>Focus Deck — one-time import</title></head>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;">
<h1>Import your Focus Deck data</h1>
<p>Paste the JSON from your Claude Artifact below (open the artifact, view page source, copy everything inside <code>&lt;script type="application/json" id="initial-state"&gt;</code>), then click Import. Do this once, then delete this page.</p>
<textarea id="json-in" rows="14" style="width:100%;font-family:monospace;"></textarea>
<br><button id="go">Import into this browser</button>
<p id="result"></p>
<script type="module">
// Merges into whatever this browser already has instead of replacing it: the existing data is
// backed up first, and the Gist ID and any projects not in the pasted JSON are kept.
import { state, saveStateLocal, backupRaw, STORAGE_KEY } from './js/state.js';
import { mergeStates } from './js/merge.js';

document.getElementById('go').addEventListener('click', () => {
  const raw = document.getElementById('json-in').value.trim();
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data.projects)) throw new Error('missing "projects" array — did you paste the right JSON?');
    // stamp updatedAt on every task the artifact didn't have that field on, so Task 6's
    // conflict resolution has a value to compare instead of crashing on undefined
    const now = Date.now();
    data.projects.forEach((p) => (p.tasks || []).forEach((t) => { if (!t.updatedAt) t.updatedAt = now; }));
    const existingProjects = state.projects.length;
    if (existingProjects && !confirm('This browser already has ' + existingProjects + ' project(s). The pasted data will be merged in — nothing existing is removed, and a backup of the current data is kept. Continue?')) return;
    backupRaw(localStorage.getItem(STORAGE_KEY), 'before artifact import');
    const merged = mergeStates(state, data);
    Object.keys(merged).forEach((k) => { state[k] = merged[k]; });
    if (!saveStateLocal(state)) throw new Error('this browser refused to save it (storage full or blocked).');
    document.getElementById('result').textContent =
      'Imported ' + data.projects.length + ' projects, ' +
      data.projects.reduce((n, p) => n + (p.tasks || []).length, 0) + ' tasks. Open the real app now.';
  } catch (e) {
    document.getElementById('result').textContent = 'Import failed: ' + e.message;
  }
});
</script>
</body></html>
