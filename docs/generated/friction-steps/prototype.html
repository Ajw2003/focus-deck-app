<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step by step prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Clickable prototype of the step-by-step redesign (QA of #248 failed: too busy). A drawing, not the app.
   ?all shows every screen in rows by flow (shot by shoot-prototype.cjs); no query = click through one phone. */
:root{--bg:#E4E8EF;--surface:#FBFAF7;--ink:#1C2438;--soft:#59627A;--faint:#8A93A8;--line:#C7CEDB;--accent:#8F5A06;--tint:#F6EBD7;--paper:#FFFEFA;--note:#FFE27A;--folder:#F1E6CC;--red:#B42318;--green:#2F7A4B;
 --pen:#1F4FA8;--rule:#BFD3EA;--margin:#E3828A;--manila:#EBD7A8;--manila-dark:#C9AE72;--board:#A9784A;--wood:#7A4E2D;--brass:#C9A24B;--ink-stamp:#9A3B12;--hand:Kalam,cursive;--type:'Courier Prime','Courier New',monospace}
*{box-sizing:border-box}body{margin:0;background:#fff;font:16px/1.4 Figtree,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
[data-go]{cursor:pointer}
/* the desk */
.phone.tall{height:800px}.phone{width:300px;height:640px;background:var(--bg);border-radius:28px;border:8px solid #1d2230;position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}
.logo{white-space:nowrap;font:600 17px Fraunces,serif;display:flex;align-items:center;gap:7px}.logo:before{content:"";width:9px;height:9px;border-radius:50%;background:#D98A12;box-shadow:0 0 8px 3px rgba(217,138,18,.45)}
.topr{display:flex;align-items:center;gap:10px}
/* + Jot is a little notepad: binding holes along the top, written in pen */
.jot{white-space:nowrap;background:radial-gradient(circle at 6px 4px,var(--bg) 2px,transparent 2.5px) 0 0/12px 8px repeat-x,var(--paper);color:var(--pen);font:700 15px var(--hand);padding:9px 12px 4px;border-radius:2px;box-shadow:0 2px 4px rgba(40,52,80,.3);transform:rotate(-2deg);border-bottom:2px solid var(--rule)}
/* the sync light and the settings dial */
.sync{width:12px;height:12px;border-radius:50%;background:#3DBE6B;box-shadow:0 0 6px 2px rgba(61,190,107,.6),inset 0 -2px 2px rgba(0,0,0,.25);font-size:0}
.icon{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3E3B0,var(--brass) 60%,#8C6A22);color:#4A3510;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 3px rgba(0,0,0,.3)}
/* Showing: a strip of label-maker tape. ⋯ is a drawer pull */
.ctx{margin:2px 12px 4px;display:flex;justify-content:space-between;align-items:center}
.ctx>button:first-child{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#20242C;color:#F4F4F4;font:700 11px/1 var(--type);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4);text-shadow:0 1px 0 #000}
.ctx>button:first-child b{color:#fff}
.pull{width:44px;height:14px;border-radius:7px;background:linear-gradient(#F3E3B0,var(--brass) 55%,#8C6A22);box-shadow:0 2px 3px rgba(0,0,0,.35);font-size:0;position:relative}.pull:after{content:"";position:absolute;inset:4px 10px;border-radius:3px;background:rgba(0,0,0,.25)}
/* steps: a manila ticket strip, a hole punched for each step done */
.prog{margin:4px 12px 0;display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--manila);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.prog i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--manila-dark)}.prog i.on{background:#3C4252;border:0;box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.stepname{margin-left:auto;font:700 10px var(--type);color:#5B4A22;white-space:nowrap}.stepnote{margin:2px 14px 0;font:13px var(--hand);color:#6A7184}
/* the clipboard every question is written on */
.board{flex:1;margin:6px 10px 2px;background:var(--board);border-radius:10px;padding:13px 5px 5px;position:relative;display:flex;flex-direction:column;min-height:0;box-shadow:0 3px 6px rgba(60,40,20,.3)}
.board:before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:84px;height:16px;border-radius:4px 4px 8px 8px;background:linear-gradient(#E7E9EE,#9EA4AF);box-shadow:0 2px 2px rgba(0,0,0,.35);z-index:2}
.paper{flex:1;background:var(--paper);border-radius:2px;display:flex;flex-direction:column;min-height:0;padding-top:4px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
h2{font:600 20px/1.2 Fraunces,serif;margin:6px 12px 2px}
.sub,.muted{font:15px/1.25 var(--hand);color:#6A7184}
.sub{margin:0 12px 4px}.muted{margin:0}
.body{flex:1;padding:0 10px 6px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
/* a choice is an index card: red margin, a blue rule; the one you picked has a paperclip */
.choice{position:relative;background:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 17px,transparent 17px),linear-gradient(transparent calc(100% - 3px),var(--rule) calc(100% - 3px),var(--rule) calc(100% - 2px),transparent calc(100% - 2px)),#FFFDF8;border-radius:2px;padding:8px 10px 8px 24px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;box-shadow:0 1px 2px rgba(40,52,80,.25),0 0 0 1px rgba(40,52,80,.06)}
.choice small{font:13px var(--hand);color:#6A7184;text-align:right}
.choice.on{background:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 17px,transparent 17px),linear-gradient(transparent calc(100% - 3px),var(--rule) calc(100% - 3px),var(--rule) calc(100% - 2px),transparent calc(100% - 2px)),#FFF6D8;box-shadow:0 2px 5px rgba(40,52,80,.3),0 0 0 2px var(--accent)}
.choice.on:before{content:"";position:absolute;left:6px;top:-6px;width:9px;height:26px;border:2px solid #8E96A6;border-radius:6px;box-shadow:inset 0 0 0 2px #fff0}
.choice.danger{color:var(--red)}.choice.danger:after{content:"🗑";font-size:14px}
/* the bottom row: a folded-back page corner, a sticky flag, a luggage tag and an ink-stamped card */
.foot{padding:6px 10px 8px;display:flex;align-items:center;gap:8px}
.back{font:700 15px var(--hand);color:var(--ink);padding:8px 10px 8px 8px;background:linear-gradient(225deg,var(--bg) 9px,#D9D2C0 9px,#EFE9DA 13px,var(--paper) 13px);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.skip,.link{font:700 14px var(--hand);color:#1C2438;background:#FFD84D;padding:5px 16px 5px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%);box-shadow:0 1px 1px rgba(0,0,0,.2);align-self:flex-start;white-space:nowrap}
.link{background:#9FD3F2;font-size:14px}.row2 .link{font-size:13px;padding:5px 12px 5px 6px;flex:none}.row2:has(.link){justify-content:space-between}
.primary{flex:1;text-align:center;font:800 14px/1.15 Figtree;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-stamp);background:var(--paper);padding:10px 8px;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink-stamp),inset 0 0 0 7px var(--paper),inset 0 0 0 8px var(--ink-stamp);transform:rotate(-1deg)}
.primary.off{opacity:.45}
.second{flex:1;text-align:center;font:700 14px/1.15 Figtree;color:#4A3510;background:radial-gradient(circle at 12px 50%,var(--bg) 4px,#9B7B3C 4.5px,#9B7B3C 5.5px,transparent 6px),var(--manila);padding:10px 8px 10px 22px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);box-shadow:0 2px 3px rgba(0,0,0,.25)}
/* the tabs are binder dividers along the bottom */
.tabs{display:flex;gap:3px;background:#3B4252;padding:6px 6px 10px;box-shadow:inset 0 3px 4px rgba(0,0,0,.4)}
.tabs button{flex:1;text-align:center;font:700 10px Figtree;color:#3B4252;position:relative;border-radius:8px 8px 2px 2px;padding:4px 0 3px;background:#C9D2E0}
.tabs button:nth-child(1){background:#F3D98B}.tabs button:nth-child(2){background:#BFDCC4}.tabs button:nth-child(3){background:#C7D6F0}.tabs button:nth-child(4){background:#F2C7B8}.tabs button:nth-child(5){background:#DCCDEB}
.tabs .on{transform:translateY(-5px);box-shadow:0 -2px 4px rgba(0,0,0,.35);color:#000}
.tabs b{display:block;font-size:15px;font-weight:400}.tabs sup{position:absolute;top:-6px;right:4px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.4)}
/* a thought is a torn jotter slip; a task's ⋯ is a drawer pull too */
.slip{background:radial-gradient(circle at 8px 5px,var(--bg) 2.5px,transparent 3px) 0 0/16px 10px repeat-x,var(--paper);border-radius:2px;box-shadow:0 2px 5px rgba(40,52,80,.25);padding:14px 30px 8px 12px;font:700 17px/1.25 var(--hand);margin:6px 12px 2px;position:relative;border-bottom:2px solid var(--rule)}
.paper .slip{margin:6px 10px 4px}
.slip .more{position:absolute;right:8px;top:12px;width:20px;height:8px;border-radius:4px;background:linear-gradient(#F3E3B0,var(--brass) 55%,#8C6A22);box-shadow:0 1px 2px rgba(0,0,0,.35);font-size:0}
/* column tabs on the Roadmap are the tabs on a file folder */
.chips{display:flex;flex-wrap:wrap;gap:4px;border-bottom:3px solid var(--manila)}.chip{background:#E9DFC6;border-radius:8px 8px 0 0;padding:5px 9px 3px;font-weight:700;font-size:12px;color:#5B4A22}.chip.on{background:var(--manila);color:#2B2210;padding-top:7px}
/* carousels: folders for projects, index cards for kinds of work, calendar pages for dates */
.deck{position:relative;height:112px;flex:none;perspective:600px;margin-top:4px}
.deck>*{position:absolute;top:14px;width:150px;height:92px}
.deck>:first-child{left:6px;z-index:2}.deck>:nth-child(2){left:150px;transform:rotateY(-38deg) scale(.92);transform-origin:left center;filter:brightness(.88);z-index:1}
.folder{background:var(--folder);border-radius:3px 10px 10px 10px;padding:10px 12px;font-weight:700;box-shadow:0 3px 6px rgba(60,40,10,.25)}
.folder:before{content:"";position:absolute;top:-12px;left:0;width:64px;height:14px;background:inherit;border-radius:8px 8px 0 0}
.folder small{display:block;font:13px var(--hand);color:#6B5520;margin-top:14px}
.folder.on{background:#E7C77D}
.tap{position:absolute;right:8px;bottom:6px;font:800 10px Figtree;letter-spacing:.08em;color:var(--ink-stamp);border:2px solid var(--ink-stamp);padding:1px 4px;transform:rotate(-6deg);border-radius:2px}
.icard{background:linear-gradient(90deg,transparent 18px,var(--margin) 18px,var(--margin) 19px,transparent 19px),repeating-linear-gradient(transparent 0 21px,var(--rule) 21px 22px),#FFFDF8;border-top:6px solid var(--c,#4A6FB5);border-radius:2px;padding:6px 10px 6px 26px;font-weight:700;box-shadow:0 3px 6px rgba(40,52,80,.25)}
.icard small{display:block;font:13px var(--hand);color:#6A7184;font-weight:400}
.icard.on:after{content:"";position:absolute;right:14px;top:-14px;width:11px;height:30px;border:2.5px solid #7D8596;border-radius:7px}
.dots{font:13px var(--hand);color:#6A7184;text-align:center;margin:0}
.picked{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:14px var(--hand);color:#6A7184}
.picked b{font:700 12px Figtree;background:var(--manila);color:#2B2210;padding:3px 10px 3px 14px;clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%,0 50%)}
.calpage{background:var(--paper);border-radius:3px;text-align:center;box-shadow:0 3px 6px rgba(40,52,80,.25);overflow:hidden;font-weight:700}
.calpage i{display:block;background:var(--red);color:#fff;font:800 11px Figtree;letter-spacing:.08em;padding:4px 0;font-style:normal;position:relative}
.calpage i:before{content:"";position:absolute;top:-3px;left:30%;right:30%;height:6px;background:radial-gradient(circle,#7D8596 2.5px,transparent 3px) 0 0/14px 6px repeat-x}
.calpage b{display:block;font:600 34px/1.1 Fraunces,serif}.calpage small{font:13px var(--hand);color:#6A7184;font-weight:400}
.calpage.on{box-shadow:0 0 0 3px var(--accent),0 3px 6px rgba(40,52,80,.3)}
/* page flags for priority */
.flags{display:flex;flex-direction:column;gap:6px;padding-left:0}
.flag{display:flex;align-items:center;justify-content:space-between;width:86%;padding:8px 18px 8px 12px;font-weight:800;color:#1C2438;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.1);opacity:.85}
.flag small{font:13px var(--hand);font-weight:400}
.flag.on{width:100%;opacity:1;filter:saturate(1.2);box-shadow:inset 4px 0 0 rgba(0,0,0,.25)}
/* the search box is a magnifying glass over a ruled strip; a text box is a jotter strip */
.find{flex:none;background:repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px),#FFFDF8;border-radius:2px;padding:6px 10px 6px 34px;font:15px var(--hand);color:#8A93A8;position:relative;box-shadow:0 1px 2px rgba(40,52,80,.2)}
.find:before{content:"";position:absolute;left:9px;top:8px;width:12px;height:12px;border-radius:50%;border:2.5px solid #5B4A22;background:rgba(190,220,240,.6)}
.find:after{content:"";position:absolute;left:21px;top:21px;width:8px;height:3px;background:#5B4A22;transform:rotate(45deg);border-radius:2px}
.field{flex:none;background:radial-gradient(circle at 8px 5px,var(--bg) 2.5px,transparent 3px) 0 0/16px 10px repeat-x,repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px),var(--paper);background-position:0 0,0 12px,0 0;border-radius:2px;padding:14px 12px 6px;font:700 16px/28px var(--hand);color:var(--pen);min-height:48px;box-shadow:0 1px 3px rgba(40,52,80,.25)}
/* the check screen is a till receipt; Change is a pencil */
.summary{flex:none;background:var(--paper);font:12.5px/1.3 var(--type);box-shadow:0 2px 4px rgba(40,52,80,.2);padding:6px 0 10px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%}
.summary>div{display:flex;justify-content:space-between;gap:6px;padding:5px 10px;border-top:1px dashed #C9C2B0;align-items:center}.summary>div:first-child{border:0}
.summary span{color:#6A7184;flex:none;width:68px;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}.summary em{font-style:normal;flex:1;font-weight:700}
.summary a{font:700 13px var(--hand);color:var(--pen);white-space:nowrap}.summary a:not(:empty):before{content:"✎ "}
/* tasks are small index cards */
.card{flex:none;background:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 17px,transparent 17px),#FFFDF8;border-top:3px solid var(--margin);border-radius:2px;padding:7px 10px 7px 24px;box-shadow:0 1px 3px rgba(40,52,80,.25)}
.card h3{margin:0 0 1px;font-size:15px}.card p{margin:0;font:13px var(--hand);color:#6A7184}
.row2{display:flex;gap:8px}.row2>*{flex:1;justify-content:center;text-align:center}
/* progress is a ruler, filled in with highlighter */
.bar{height:14px;border-radius:2px;background:repeating-linear-gradient(90deg,#8C7A55 0 1px,transparent 1px 10%) 0 100%/100% 6px no-repeat,#EED9A0;overflow:hidden;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.25)}.bar i{display:block;height:100%;background:rgba(242,130,30,.55)}
.note{background:var(--note);padding:16px;border-radius:2px;font:700 21px/1.25 var(--hand);box-shadow:0 6px 10px rgba(0,0,0,.18);transform:rotate(-1deg)}
.note small{display:block;font:400 13px Figtree;color:#6B5520;margin-bottom:6px}
/* a tick box drawn in biro */
.tick{display:flex;gap:10px;align-items:center;font:600 14px Figtree}.tick i{width:20px;height:20px;border:2px solid #3C4252;border-radius:2px 4px 3px 2px;flex:none;font:700 20px/14px var(--hand);text-align:center;color:var(--pen);font-style:normal;transform:rotate(-2deg)}
/* a ruler with a paperclip on it for the milestone's share */
.slider{height:26px;background:repeating-linear-gradient(90deg,#8C7A55 0 1px,transparent 1px 10%) 0 100%/100% 8px no-repeat,#EED9A0;border-radius:2px;position:relative;margin:16px 0 8px;box-shadow:0 1px 2px rgba(0,0,0,.25)}.slider i{position:absolute;left:0;top:0;bottom:0;background:rgba(242,130,30,.45)}.slider u{position:absolute;top:-12px;width:12px;height:40px;border:3px solid #7D8596;border-radius:7px}
/* a message is a torn-off jotter slip */
.toast{position:absolute;left:14px;right:14px;bottom:128px;background:radial-gradient(circle at 8px 5px,rgba(0,0,0,.25) 2.5px,transparent 3px) 0 0/16px 10px repeat-x,var(--paper);padding:14px 14px 8px;font:700 15px var(--hand);display:flex;justify-content:space-between;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.3);transform:rotate(1deg);z-index:3}.toast a{color:var(--pen);text-decoration:underline}
.dim{position:absolute;inset:0;background:rgba(20,26,40,.45);z-index:4}
/* a menu is a card-index drawer pulled open */
.sheet{position:absolute;left:6px;right:6px;bottom:0;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 8%,transparent 92%,rgba(0,0,0,.08)),repeating-linear-gradient(95deg,#6E4527 0 3px,#7A4E2D 3px 9px,#835634 9px 13px);border-radius:8px 8px 0 0;padding:20px 10px 12px;display:flex;flex-direction:column;max-height:88%;z-index:5;box-shadow:0 -4px 12px rgba(0,0,0,.4)}
.sheet:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:60px;height:10px;border-radius:5px;background:linear-gradient(#F3E3B0,var(--brass) 55%,#8C6A22)}
.sheet h2{background:var(--paper);margin:0 0 6px;padding:6px 10px;font-size:17px;border:3px solid var(--brass);border-radius:3px}
.sheet .sub{color:#F2E6D0;margin:0 0 6px}.sheet .muted{color:#F2E6D0}
.sheet .body{flex:none;padding:0 0 4px;overflow:visible}
.sheet .back{align-self:flex-start}
/* the stamps */
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stampk{text-align:center;font:800 13px Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--c);padding:10px 4px;border:3px double var(--c);border-radius:4px;transform:rotate(var(--r,-3deg));opacity:.45;background:#FFFDF8}
.stampk.on{opacity:1;box-shadow:0 0 0 3px #FFFDF8,0 0 0 5px var(--accent)}
/* Tidy up: a tray, a bin and a stapler */
.obj{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px var(--hand);color:var(--ink);padding:6px 4px;background:#FFFDF8;border-radius:4px;box-shadow:0 1px 3px rgba(40,52,80,.25)}
.obj svg{width:44px;height:34px}
.swatch{width:40px;height:56px;border-radius:2px;background:var(--c);box-shadow:0 2px 3px rgba(0,0,0,.3);position:relative}.swatch:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#FFFDF8}
.swatch.on{outline:3px solid var(--ink);outline-offset:3px}
.drawer{background:#E9DFC6;border-radius:3px;padding:8px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.drawer .tabrow{display:flex;gap:4px}.drawer .tabrow b{font:700 11px Figtree;background:var(--manila-dark);color:#2B2210;padding:2px 8px;border-radius:6px 6px 0 0}
.keys{display:flex;gap:4px}.keys b{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4A5163,#1C2438);color:#F4F4F4;display:grid;place-items:center;font-size:13px;box-shadow:0 2px 0 #000,0 0 0 2px #B8BFCC}
.kit{display:grid;grid-template-columns:repeat(4,330px);gap:14px}.kitem{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.kitem p{margin:0;font-size:13px;color:var(--soft)}.kitem>p b{color:var(--ink);font-size:14px}.kdemo{display:flex;flex-direction:column;gap:6px;position:relative}.kdemo .deck{width:300px}
.x{position:absolute;right:16px;top:10px;font-size:22px;color:var(--soft)}
/* gallery */
.flow{padding:20px 24px 8px;border-top:1px solid #e3e6ec}.flow h1{font:600 26px Fraunces,serif;margin:0 0 4px}.flow>p{margin:0 0 14px;color:var(--soft);max-width:900px}
.frames{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.frame .cap{font:600 14px Figtree;color:var(--soft);margin:0 0 6px;width:300px;min-height:40px}.frame .id{color:var(--faint);font-weight:400}
/* click-through */
.proto{display:flex;gap:28px;padding:20px;align-items:flex-start;flex-wrap:wrap}
.nav{width:280px;font-size:14px}.nav h3{margin:14px 0 4px;font-size:14px}.nav button{display:block;color:var(--accent);padding:2px 0}
.nav .now{font-weight:700;color:var(--ink)}
@media (max-width:700px){.proto{padding:8px}.nav{order:2}}

<script>
// ---------- building blocks ----------
const TABS = [['sort','☰','1 Sort',10],['organize','🗑','2 Organize'],['roadmap','≡','3 Roadmap'],['focus','◎','4 Focus'],['review','✓','5 Review',5]];

function phone(id) {
  const o = S[id];
  if (o.sheet) return phoneBase(S[o.over], o.over, '<div class="dim" data-go="' + o.over + '"></div><div class="sheet">' + (o.h ? '<h2>' + o.h + '</h2>' : '') + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '') + '<div class="body">' + (o.body || '') + '</div>' + (o.btn ? foot(o) : '') + '</div>');

    + (o.step ? '<div class="prog">' + (o.step[1] <= 10 ? Array.from({ length: o.step[1] }, (_, i) => '<i class="' + (i < o.step[0] ? 'on' : '') + '"></i>').join('') : '') + '<span class="stepname">' + (o.stepword || 'Step') + ' ' + o.step[0] + ' of ' + o.step[1] + (o.step[2] ? ' · optional' : '') + '</span></div>' + (o.stepnote ? '<p class="stepnote">' + o.stepnote + '</p>' : '') : '')

    + (o.slip ? '<div class="slip">' + o.slip + (o.slipmenu ? '<button class="more" data-go="' + o.slipmenu + '" aria-label="More">⋯</button>' : '') + '</div>' : '')

    + '<div class="body">' + (o.body || '') + '</div></div></div>'
    + ((o.btn || o.back || o.btn2) ? foot(o) : '')
    + (o.toast ? '<div class="toast">' + o.toast + '</div>' : '')
    + (o.notabs || bare ? '' : tabs(o.tab || 'sort')) + extra + '</div>';
}

// screens drawn on a computer
const DESK = {
 ds:{ cap:'Sort on a computer: the same steps in one panel, with the list of steps beside it.', main:'s2', steps:STEPS9, at:1 },
 dr:{ cap:'Roadmap on a computer: the milestone fills the middle; the task sheet opens beside it instead of over it.', main:'r2', side:'r4' },
 dd:{ cap:'Task details on a computer: opens as a panel beside the list, so you never lose your place.', main:'r2', side:'d0' },
};
function desk(k) {
  const d = DESK[k], inner = (id) => { const o = S[id]; return o.sheet ? '<div class="panel" style="width:330px">' + '<h2>' + o.h + '</h2>' + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '') + '<div class="body">' + o.body + '</div></div>' : phoneBase(o, id, '', true).replace('class="panel"', 'class="panel"' + (d.side && id === d.side ? ' style="width:340px"' : '')); };
  return '<div class="desk">' + topbar({}) + '<div class="deskrow"><div class="rail">' + TABS.map(([t, i, n]) => '<span class="' + (S[d.main].tab === t ? 'on' : '') + '">' + i + ' ' + n + '</span>').join('') + '</div><div class="deskmain">' + inner(d.main)
    + (d.steps ? '<div class="stepsbox">' + d.steps.map((s, i) => '<span class="' + (i < d.at ? 'done' : i === d.at ? 'now' : '') + '">' + (i < d.at ? '✓ ' : i === d.at ? '● ' : '') + s + '</span>').join('') + '</div>' : '')
    + (d.side ? inner(d.side) : '') + '</div></div></div>';
}

} else {
  const show = (id) => {
    if (!S[id]) return;
