<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step by step prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Clickable prototype of the step-by-step redesign (QA of #248 failed: too busy). A drawing, not the app.
   ?all shows every screen in rows by flow (shot by shoot-prototype.cjs); no query = click through one phone. */
:root{--bg:#E4E8EF;--surface:#FBFAF7;--ink:#1C2438;--soft:#59627A;--faint:#8A93A8;--line:#C7CEDB;--accent:#8F5A06;--tint:#F6EBD7;--paper:#FFFEFA;--note:#FFE27A;--folder:#F1E6CC;--red:#B42318;--green:#2F7A4B}
*{box-sizing:border-box}body{margin:0;background:#fff;font:16px/1.4 Figtree,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
[data-go]{cursor:pointer}
.phone.tall{height:780px}.phone{width:300px;height:640px;background:var(--bg);border-radius:28px;border:8px solid #1d2230;position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.logo{white-space:nowrap;font:600 18px Fraunces,serif;display:flex;align-items:center;gap:8px}.logo:before{content:"";width:9px;height:9px;border-radius:50%;background:#D98A12}
.topr{display:flex;align-items:center;gap:12px}.jot{white-space:nowrap;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.icon{font-size:18px;color:var(--soft)}.sync{font-size:12px;color:var(--green);font-weight:700}
.ctx{margin:0 16px 4px;font-size:13px;color:var(--soft);display:flex;justify-content:space-between}.ctx b{color:var(--ink)}
.prog{margin:4px 16px 0;display:flex;gap:4px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--accent)}
.stepname{margin:6px 16px 0;font-size:13px;color:var(--soft)}
h2{font:600 22px/1.2 Fraunces,serif;margin:8px 16px 4px}
.sub{margin:0 16px 8px;color:var(--soft);font-size:14px}
.body{flex:1;padding:0 16px 4px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.choice small{font-weight:400;color:var(--soft);font-size:13px;text-align:right}
.choice.on{border-color:var(--accent);background:var(--tint)}
.choice.danger{color:var(--red)}
.foot{padding:8px 16px 10px;display:flex;align-items:center;gap:12px}
.back{color:var(--soft);font-weight:600;font-size:15px}
.primary{flex:1;background:var(--accent);color:#fff;border-radius:14px;padding:13px;text-align:center;font-weight:700}
.primary.off{opacity:.45}
.second{flex:1;border:2px solid var(--accent);color:var(--accent);border-radius:14px;padding:11px;text-align:center;font-weight:700}
.skip,.link{color:var(--accent);font-weight:600;font-size:15px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 10px}
.tabs button{flex:1;text-align:center;font-size:11px;color:var(--soft);position:relative}.tabs .on{color:var(--accent);font-weight:700}
.tabs b{display:block;font-size:17px;font-weight:400}.tabs sup{position:absolute;top:-2px;right:14px;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}
.slip{background:var(--paper);border-radius:6px;box-shadow:0 2px 6px rgba(40,52,80,.2);padding:10px 14px;font:700 18px/1.25 Kalam,cursive;margin:6px 16px 4px;position:relative}
.slip .more{position:absolute;right:8px;top:4px;font:700 18px Figtree;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}.chip.on{border-color:var(--accent);background:var(--tint)}
.folders{display:flex;gap:10px;overflow:hidden;flex:none}.folder{flex:0 0 140px;height:92px;background:var(--folder);border-radius:4px 12px 12px 12px;padding:10px 12px;font-weight:700;position:relative;margin-top:12px}
.folder:before{content:"";position:absolute;top:-12px;left:0;width:70px;height:14px;background:inherit;border-radius:8px 8px 0 0}
.folder.on{outline:3px solid var(--accent)}.folder small{display:block;font-weight:400;color:var(--soft);margin-top:14px;font-size:13px}
.find{border:2px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--faint);background:var(--surface);flex:none}
.field{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--surface);min-height:44px}
.summary{background:var(--surface);border-radius:14px;border:1px solid var(--line);flex:none}
.summary>div{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:13px;border-top:1px solid var(--line);font-size:14px;align-items:center}.summary>div:first-child{border:0}
.summary span{color:var(--soft);flex:none;width:76px}.summary em{font-style:normal;flex:1}.summary a{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex:none}
.card h3{margin:0 0 2px;font-size:16px}.card p{margin:0;color:var(--soft);font-size:13px}
.row2{display:flex;gap:8px}.row2>*{flex:1;justify-content:center;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:none}.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--soft);font-size:13px;margin:0}
.note{background:var(--note);padding:16px;border-radius:4px;font:700 21px/1.25 Kalam,cursive;box-shadow:0 4px 10px rgba(0,0,0,.18);transform:rotate(-1deg)}
.note small{display:block;font:400 13px Figtree;color:#6B5520;margin-bottom:6px}
.tick{display:flex;gap:10px;align-items:center;font-size:14px}.tick i{width:20px;height:20px;border:2px solid var(--soft);border-radius:5px;flex:none;font-style:normal;text-align:center;line-height:16px;font-size:13px}.tick i.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:var(--surface);border-radius:12px;border:1px solid var(--line);padding:3px;flex:none}.seg b{flex:1;text-align:center;padding:6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--soft)}.seg b.on{background:var(--tint);color:var(--accent)}
.slider{height:6px;background:var(--line);border-radius:3px;position:relative;margin:14px 0}.slider i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}.slider u{position:absolute;top:-8px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.toast{position:absolute;left:12px;right:12px;bottom:128px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:8px}.toast a{color:#FFD58A;font-weight:700}
.dim{position:absolute;inset:0;background:rgba(20,26,40,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 0 14px;display:flex;flex-direction:column;max-height:88%}
.sheet:before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet .body{flex:none}
.x{position:absolute;right:16px;top:10px;font-size:22px;color:var(--soft)}
/* gallery */
.flow{padding:20px 24px 8px;border-top:1px solid #e3e6ec}.flow h1{font:600 26px Fraunces,serif;margin:0 0 4px}.flow>p{margin:0 0 14px;color:var(--soft);max-width:900px}
.frames{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.frame .cap{font:600 14px Figtree;color:var(--soft);margin:0 0 6px;width:300px;min-height:40px}.frame .id{color:var(--faint);font-weight:400}
/* click-through */
.proto{display:flex;gap:28px;padding:20px;align-items:flex-start;flex-wrap:wrap}
.nav{width:280px;font-size:14px}.nav h3{margin:14px 0 4px;font-size:14px}.nav button{display:block;color:var(--accent);padding:2px 0}
.nav .now{font-weight:700;color:var(--ink)}
@media (max-width:700px){.proto{padding:8px}.nav{order:2}}
.hint{max-width:300px;color:var(--soft);font-size:14px}
.hot{outline:2px dashed rgba(143,90,6,.0)}.proto [data-go]:hover{outline:2px dashed rgba(143,90,6,.6);outline-offset:2px;border-radius:8px}
.desk{width:1200px;height:600px;background:var(--bg);border-radius:12px;border:8px solid #1d2230;display:flex;flex-direction:column;overflow:hidden;flex:none}
.desk .top{background:var(--surface);border-bottom:1px solid var(--line)}
.deskrow{flex:1;display:flex;overflow:hidden}
.rail{flex:none;width:190px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;font-weight:600;color:var(--soft);border-right:1px solid var(--line)}.rail .on{color:var(--accent)}
.deskmain{flex:1;display:flex;justify-content:center;gap:24px;padding:20px}
.panel{width:520px;background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:14px 0 6px;display:flex;flex-direction:column;position:relative}
.stepsbox{width:200px;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:8px;padding-top:30px}.stepsbox .done{color:var(--ink)}.stepsbox .now{color:var(--accent);font-weight:700}
</style></head><body>
<div id="root"></div>
<script>
// ---------- building blocks ----------
const TABS = [['sort','☰','1 Sort',10],['organize','🗑','2 Organize'],['roadmap','≡','3 Roadmap'],['focus','◎','4 Focus'],['review','✓','5 Review',5]];
const FIRST = { sort:'s0', organize:'o0', roadmap:'r0', focus:'f1', review:'v1' };
const tabs = (on) => '<div class="tabs">' + TABS.map(([k,i,n,c]) => '<button data-go="' + FIRST[k] + '" class="' + (k === on ? 'on' : '') + '"><b>' + i + '</b>' + n + (c ? '<sup>' + c + '</sup>' : '') + '</button>').join('') + '</div>';
const topbar = (o) => '<div class="top"><span class="logo">Focus Deck</span><span class="topr">'
  + (o.close ? '<button class="icon" style="font-size:22px" data-go="' + o.close + '">×</button>'
     : '<button class="jot" data-go="j1">+ Jot</button><button class="sync" data-go="g4" aria-label="Synced">●</button><button class="icon" data-go="x1">⚙</button>') + '</span></div>';
const C = (t, o = {}) => '<button class="choice' + (o.on ? ' on' : '') + (o.danger ? ' danger' : '') + '"' + (o.go ? ' data-go="' + o.go + '"' : '') + '>' + t + (o.small ? '<small>' + o.small + '</small>' : '') + '</button>';
const chips = (a, on = [], go) => '<div class="chips">' + a.map((x) => '<span class="chip' + (on.includes(x) ? ' on' : '') + '"' + (go ? ' data-go="' + go + '"' : '') + '>' + x + '</span>').join('') + '</div>';
const folders = (a, go) => '<div class="folders">' + a.map(([n, s, on]) => '<div class="folder' + (on ? ' on' : '') + '"' + (go ? ' data-go="' + go + '"' : '') + '>' + n + '<small>' + s + '</small></div>').join('') + '</div>';
const sum = (rows, go) => '<div class="summary">' + rows.map(([k, v, g]) => '<div' + ((g || go) && g !== '-' ? ' data-go="' + (g || go) + '"' : '') + '><span>' + k + '</span><em>' + v + '</em>' + ((g || go) ? '<a>' + (g === '-' ? '' : 'Change') + '</a>' : '') + '</div>').join('') + '</div>';
const card = (h, p, go) => '<div class="card"' + (go ? ' data-go="' + go + '"' : '') + '><h3>' + h + '</h3>' + (p ? '<p>' + p + '</p>' : '') + '</div>';
const tick = (t, on, go) => '<div class="tick"' + (go ? ' data-go="' + go + '"' : '') + '><i class="' + (on ? 'on' : '') + '">' + (on ? '✓' : '') + '</i>' + t + '</div>';
const seg = (a, on) => '<div class="seg">' + a.map((x) => '<b class="' + (x === on ? 'on' : '') + '">' + x + '</b>').join('') + '</div>';
const SLIP = 'Get three quotes for fixing the shed door';
const STEPS9 = ['Project','Priority','Labels','Due date','Part of','Subtasks','Waits on','Holds up','Check'];

// a screen: { tab, ctx, step:[n, of, opt], slip, h, sub, body, back, skip, btn, go, btn2, go2, close, notabs, toast, sheet:{over, h, sub, body} }
function phone(id) {
  const o = S[id];
  if (o.sheet) return phoneBase(S[o.over], o.over, '<div class="dim" data-go="' + o.over + '"></div><div class="sheet">' + (o.h ? '<h2>' + o.h + '</h2>' : '') + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '') + '<div class="body">' + (o.body || '') + '</div>' + (o.btn ? foot(o) : '') + '</div>');
  return phoneBase(o, id, '');
}
const foot = (o) => '<div class="foot">' + (o.back ? '<button class="back" data-go="' + o.back + '">‹ Back</button>' : '') + (o.skip ? '<button class="skip" data-go="' + o.skip + '">Skip</button>' : '')
  + (o.btn2 ? '<button class="second" data-go="' + o.go2 + '">' + o.btn2 + '</button>' : '') + (o.btn ? '<button class="primary' + (o.off ? ' off' : '') + '" data-go="' + (o.go || '') + '">' + o.btn + '</button>' : '') + '</div>';
function phoneBase(o, id, extra, bare) {
  return '<div class="' + (bare ? 'panel' : 'phone') + (o.tall && !bare ? ' tall' : '') + '" data-screen="' + id + '">' + (bare ? '' : topbar(o))
    + (o.ctx ? '<p class="ctx"><button data-go="g1">Showing <b>' + o.ctx + ' ▾</b></button>' + (o.menu ? '<button data-go="' + o.menu + '" style="font-weight:800;font-size:18px;line-height:12px">⋯</button>' : '') + '</p>' : '')
    + (o.step ? (o.step[1] <= 10 ? '<div class="prog">' + Array.from({ length: o.step[1] }, (_, i) => '<i class="' + (i < o.step[0] ? 'on' : '') + '"></i>').join('') + '</div>' : '') + '<p class="stepname">' + (o.stepword || 'Step') + ' ' + o.step[0] + ' of ' + o.step[1] + (o.step[2] ? ' · optional' : '') + (o.stepnote ? ' · ' + o.stepnote : '') + '</p>' : '')
    + (o.slip ? '<div class="slip">' + o.slip + (o.slipmenu ? '<button class="more" data-go="' + o.slipmenu + '">⋯</button>' : '') + '</div>' : '')
    + (o.h ? '<h2>' + o.h + '</h2>' : '') + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '')
    + '<div class="body">' + (o.body || '') + '</div>'
    + ((o.btn || o.back || o.btn2) ? foot(o) : '')
    + (o.toast ? '<div class="toast">' + o.toast + '</div>' : '')
    + (o.notabs || bare ? '' : tabs(o.tab || 'sort')) + extra + '</div>';
}

// ---------- every screen ----------
const sortStep = (n, extra) => Object.assign({ tab:'sort', ctx:'All tasks', step:[n, 9, n >= 3 && n <= 8], slip:SLIP, slipmenu:'s0m', back:'s' + (n - 1) }, extra);
const S = {
 // Header, Jot and Showing
 j1:{ close:'s0', notabs:false, h:'Jot a thought', body:'<div class="slip" style="margin:0;min-height:110px;color:#8A93A8;font-weight:400">Type it here…</div><button class="muted" data-go="j2" style="text-align:left">Goes to: <b style="color:var(--accent)">Sort ▾</b> &nbsp;(sort it later)</button><p class="muted">Enter saves. Shift and Enter starts a new line.</p>', btn:'Save thought', go:'j3' },
 j2:{ sheet:1, over:'j1', h:'Where should it go?', body:C('Sort, to sort later', { on:1, go:'j1' }) + '<div class="find">Find a project…</div>' + C('Home', { small:'add as a task', go:'j1' }) + C('Open source: focus-deck', { small:'add as a task', go:'j1' }) + '<p class="muted">On a project’s Roadmap it starts on that project.</p>' },
 j3:{ tab:'sort', ctx:'All tasks', h:'Sort', sub:'11 thoughts to sort. One at a time.', body:'<div class="slip" style="margin:0">' + SLIP + '</div><p class="muted">Thought · 3 minutes ago</p>', btn:'Sort this one', go:'s1', toast:'<span>Saved to Sort.</span>' },
 g1:{ sheet:1, over:'s0', h:'What do you want to see?', sub:'Every tab shows only this.', body:C('All tasks', { on:1, go:'s0' }) + C('One area', { small:'Home, Work…', go:'g2' }) + C('One project', { small:'19 projects', go:'g3' }) },
 g2:{ sheet:1, over:'s0', h:'Which area?', body:C('Personal', { small:'6 projects', go:'s0' }) + C('Home', { small:'4 projects', go:'s0' }) + C('Apps', { small:'3 projects', go:'s0' }) + C('Lists', { small:'2 projects', go:'s0' }) + '<button class="back" data-go="g1">‹ Back</button>' },
 g3:{ sheet:1, over:'s0', h:'Which project?', body:'<div class="find">Find a project…</div>' + C('Home', { small:'21 open', go:'r2' }) + C('Open source: focus-deck', { small:'9 open', go:'r2' }) + C('Band', { small:'3 open', go:'r2' }) + '<button class="back" data-go="g1">‹ Back</button>' },
 g4:{ sheet:1, over:'s0', h:'Sync', sub:'Your tasks match on every device and on GitHub.', body:sum([['Last sync','2 minutes ago'],['GitHub','3 projects linked']]) + C('Sync now', { go:'s0' }) + C('Sync settings ›', { go:'x1' }) },
 x1:{ close:'s0', notabs:true, h:'Settings', sub:'One section opens at a time, as today.', body:sum([['Set up','2 of 3 done','-'],['Looks','Handwriting, 8 areas, 45 kinds','-'],['Comfort','Movement, colour, cards','-'],['Works','Tap twice, due dates','-'],['Sync','Off','-'],['Help','Replay the welcome','-']]) + '<p class="muted">Settings and the welcome already pass the calm check (10 and 7 things to press), so they stay as they are.</p>' },

 // Sort, one thought
 s0:{ tab:'sort', ctx:'All tasks', h:'Sort', sub:'10 thoughts to sort. One at a time.', body:'<div class="slip" style="margin:0">' + SLIP + '<button class="more" data-go="s0m">⋯</button></div><p class="muted">Thought · 3 minutes ago · No notes</p><button class="link" data-go="m1" style="text-align:left">Sort several at once instead</button>', btn:'Sort this one', go:'s1' },
 s0m:{ sheet:1, over:'s0', h:'This thought', body:C('Add notes', { go:'s0n' }) + C('Done already', { small:'ticks it off', go:'s0' }) + C('Later', { small:'next thought', go:'s0' }) + C('Delete', { danger:1, go:'s0' }) },
 s0n:{ tab:'sort', close:'s0', slip:SLIP, h:'Notes', body:'<div class="field" style="min-height:140px;color:var(--faint)">Anything to remember…</div>', btn:'Save notes', go:'s0', back:'s0' },
 s1:sortStep(1, { back:'s0', h:'Which project?', body:'<div class="find">Find a project…</div>' + folders([['Home','21 open',1],['Garden','2 open']], 's2') + '<p class="muted">Swipe for more · 1 of 19</p><button class="link" data-go="r5" style="text-align:left">+ New project</button>', btn:'Next: priority', go:'s2' }),
 s2:sortStep(2, { h:'How important is it?', body:C('Urgent', { small:'today, or it hurts' }) + C('High', { on:1, small:'this week' }) + C('Medium', { small:'soon' }) + C('Low', { small:'whenever' }) + '<button class="link" style="text-align:left">No priority</button>', btn:'Next: labels', go:'s3' }),
 s3:sortStep(3, { skip:'s4', h:'What kind of work?', sub:'Pick any. Your own kinds come first.', body:'<div class="find">Find a label…</div>' + chips(['Repair','Call','Buy','Outside','Quick win','Errand','Fix','Chore'], ['Repair','Call']) + '<button class="link" data-go="s3a" style="text-align:left">Show all 45 kinds</button><button class="link" data-go="s3b" style="text-align:left">+ New label</button>', btn:'Next: due date', go:'s4' }),
 s3a:sortStep(3, { tall:1, skip:'s4', h:'All kinds of work', sub:'A to Z. Find narrows it.', body:'<div class="find">Find a label…</div>' + chips(['Admin','Art','Bug','Build','Buy','Call','Chore','Clean','Code','Cook','Deep work','Design','Email','Errand','Evening','Family','Friends'], ['Call']) + '<p class="muted">Scroll for 30 more.</p>', back:'s3', btn:'Done', go:'s3' }),
 s3b:sortStep(3, { h:'New label', body:'<div class="field">Measure</div><p class="muted">It joins your kinds of work everywhere.</p>', back:'s3', btn:'Add label', go:'s3' }),
 s4:sortStep(4, { skip:'s5', stepnote:'Skip means no date', h:'When is it due?', body:C('Today') + C('Tomorrow') + C('Friday', { on:1 }) + C('Next week') + C('Pick a date…', { go:'s4a' }), btn:'Next: part of', go:'s4b' }),
 s4a:sortStep(4, { h:'Pick a date', body:'<div class="card" style="text-align:center;padding:14px"><b>November 2026</b><p style="margin-top:8px;letter-spacing:6px">M T W T F S S</p><p style="letter-spacing:5px;color:var(--ink)">9 10 11 12 <b style="color:var(--accent)">13</b> 14 15</p><p style="letter-spacing:5px;color:var(--ink)">16 17 18 19 20 21 22</p></div>', back:'s4', btn:'Use 13 Nov', go:'s4b' }),
 s4b:sortStep(4, { skip:'s5', stepnote:'warning', h:'When should it warn you?', sub:'Due Friday. Skip uses your setting (yellow at 33%, red at 10%).', body:C('Turn yellow', { small:'2 days left ▾' }) + C('Turn red', { small:'1 day left ▾' }), back:'s4', btn:'Next: part of', go:'s5' }),
 s5:sortStep(5, { skip:'s6', h:'Is it part of a bigger task?', sub:'Inside Home.', body:'<div class="find">Find a task in Home…</div>' + C('Rebuild the shed', { small:'Home' }) + C('Sort out the garden', { on:1, small:'Home' }), btn:'Next: subtasks', go:'s6' }),

// screens drawn on a computer
const DESK = {
 ds:{ cap:'Sort on a computer: the same steps in one panel, with the list of steps beside it.', main:'s2', steps:STEPS9, at:1 },
 dr:{ cap:'Roadmap on a computer: the milestone fills the middle; the task sheet opens beside it instead of over it.', main:'r2', side:'r4' },
 dd:{ cap:'Task details on a computer: opens as a panel beside the list, so you never lose your place.', main:'r2', side:'d0' },
};
function desk(k) {
  const d = DESK[k], inner = (id) => { const o = S[id]; return o.sheet ? '<div class="panel" style="width:330px">' + '<h2>' + o.h + '</h2>' + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '') + '<div class="body">' + o.body + '</div></div>' : phoneBase(o, id, '', true).replace('class="panel"', 'class="panel"' + (d.side && id === d.side ? ' style="width:340px"' : '')); };
  return '<div class="desk">' + topbar({}) + '<div class="deskrow"><div class="rail">' + TABS.map(([t, i, n]) => '<span class="' + (S[d.main].tab === t ? 'on' : '') + '">' + i + ' ' + n + '</span>').join('') + '</div><div class="deskmain">' + inner(d.main)
    + (d.steps ? '<div class="stepsbox">' + d.steps.map((s, i) => '<span class="' + (i < d.at ? 'done' : i === d.at ? 'now' : '') + '">' + (i < d.at ? '✓ ' : i === d.at ? '● ' : '') + s + '</span>').join('') + '</div>' : '')
    + (d.side ? inner(d.side) : '') + '</div></div></div>';
}

// ---------- render ----------
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
if (q.has('all')) {
  const only = q.get('all');
  root.innerHTML = FLOWS.filter((f) => !only || f[0] === only).map(([k, h, p, list]) => '<section class="flow" id="' + k + '"><h1>' + h + '</h1><p>' + p + '</p><div class="frames">'
    + list.map(([id, cap]) => '<div class="frame"><p class="cap">' + cap + ' <span class="id">' + id + '</span></p>' + phone(id) + '</div>').join('') + '</div></section>').join('')
    + (!only || only === 'desk' ? '<section class="flow" id="desk"><h1>On a computer</h1><p>The same screens, in a panel in the middle. The tabs move to the left.</p><div class="frames">' + Object.keys(DESK).map((k) => '<div class="frame"><p class="cap" style="width:auto">' + DESK[k].cap + '</p>' + desk(k) + '</div>').join('') + '</div></section>' : '');
} else {
  const show = (id) => {
    if (!S[id]) return;
    root.innerHTML = '<div class="proto"><div class="nav"><h2 style="margin:0 0 6px;font:600 22px Fraunces,serif">Step by step prototype</h2><p class="hint">Tap anything with a dashed outline when you hover. Or jump to a screen:</p>'
      + FLOWS.map(([k, h, , list]) => '<h3>' + h + '</h3>' + list.map(([sid, cap]) => '<button data-go="' + sid + '" class="' + (sid === id ? 'now' : '') + '">' + cap + '</button>').join('')).join('') + '</div>'
      + '<div>' + phone(id) + '<p class="hint" style="margin-top:8px">' + ((FLOWS.flatMap((f) => f[3]).find((x) => x[0] === id) || [, ''])[1]) + '</p></div></div>';
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* a sandboxed frame may refuse; the screen still shows */ }
  };
  root.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g && g.dataset.go) { e.preventDefault(); show(g.dataset.go); } });
  show(location.hash.slice(1) || 's0');
}
window.SCREENS = S; window.FLOWS = FLOWS;
