<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Ties In Views</title>
<style>html,body{margin:0;height:100%;background:#000;} iframe{border:0;width:100%;height:100%;display:block;}</style></head>
<body><iframe id="f"></iframe>
<script type="module">
// Prototype: the real app (app/index.html) with sample ties, and the proposed tie display layered on
// top of its real Board cards and Project rows. #board or #projects picks the screen. Nothing in the
// app is changed; this only adds markup and CSS to the rendered page. Overwrites Focus Deck data on
// 127.0.0.1 only.
import { seedState } from '../sort-steps/seed.js';
const screen = location.hash.slice(1) || 'board';
const st = seedState({ ties: true });
localStorage.setItem('focusdeck-onboarding', 'done');
localStorage.setItem('focusdeck-screen', screen);
localStorage.setItem('focusdeck-state-v1', JSON.stringify(st));
// Projects opens on Home alone, so its subtasks are in view
localStorage.setItem('focusdeck-project-view', 'one');
localStorage.setItem('focusdeck-selected-project', st.projects[0].id);
const f = document.getElementById('f');
f.src = '../../../app/index.html';
await new Promise((r) => f.addEventListener('load', r, { once: true }));
await new Promise((r) => setTimeout(r, 500));
const d = f.contentDocument;

const all = st.projects.flatMap((p) => p.tasks.map((t) => ({ t, p })));
const byId = (id) => all.find((x) => x.t.id === id);
const open = (x) => x && x.t.status !== 'done';
const subsOf = (id) => all.filter((x) => x.t.parentId === id);
const holdsUp = (id) => all.filter((x) => open(x) && (x.t.waitsOn || []).includes(id));
const blocked = (x) => (x.t.waitsOn || []).some((id) => open(byId(id))) || subsOf(x.t.id).some(open);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// One quiet line per task with ties: "In <parent>", "2 subtasks · 0 done", "Waits on <x>", "Holds up N".
function tieLine(x) {
  const parts = [];
  if (screen === 'board' && x.t.parentId && byId(x.t.parentId)) parts.push('<span class="tie">↳ in <b>' + esc(byId(x.t.parentId).t.title) + '</b></span>');
  const subs = subsOf(x.t.id);
  if (subs.length) parts.push('<span class="tie">' + subs.length + ' subtasks · ' + subs.filter((s) => !open(s)).length + ' done</span>');
  (x.t.waitsOn || []).map(byId).filter(open).forEach((w) => parts.push('<span class="tie wait">waits on <b>' + esc(w.t.title) + '</b>' + (w.p.id !== x.p.id ? ' · ' + esc(w.p.name) : '') + '</span>'));
  const h = holdsUp(x.t.id);
  if (h.length) parts.push('<span class="tie hold">holds up ' + h.length + '</span>');
  return parts.length ? '<span class="tie-line">' + parts.join('') + '</span>' : '';
}

const css = d.createElement('style');
css.textContent = `
.tie-line{display:flex; flex-wrap:wrap; gap:2px 10px; font-size:var(--text-sm); color:var(--ink-soft); margin-top:2px;}
.tie b{font-weight:600; color:inherit;}
.tie.wait{color:color-mix(in srgb, var(--prio-high, #c9584f) 75%, var(--ink));}
.is-waiting .board-card-title, .is-waiting .task-title{color:var(--ink-soft);}
.task-row.is-sub{margin-left:22px; position:relative;}
.task-row.is-sub::before{content:''; position:absolute; left:-12px; top:0; bottom:50%; width:8px; border-left:1.5px solid var(--line); border-bottom:1.5px solid var(--line); border-bottom-left-radius:4px;}
.task-title .tie-line{margin-top:3px;}`;
d.head.appendChild(css);

if (screen === 'board') {
  d.querySelectorAll('.board-card').forEach((card) => {
    const x = byId(card.dataset.taskId); if (!x) return;
    const line = tieLine(x); if (line) card.querySelector('.board-card-body').insertAdjacentHTML('beforeend', line);
    if (open(x) && blocked(x)) card.classList.add('is-waiting');
  });
} else {
  // Projects: open the Home folder alone, then put each subtask straight under its parent.
  d.querySelectorAll('.task-row').forEach((row) => {
    const x = byId(row.dataset.task); if (!x) return;
    const line = tieLine(x); if (line) row.querySelector('.task-title').insertAdjacentHTML('beforeend', line);
    if (open(x) && blocked(x)) row.classList.add('is-waiting');
  });
  d.querySelectorAll('.task-row').forEach((row) => {
    const x = byId(row.dataset.task); if (!x || !x.t.parentId) return;
    const parentRow = d.querySelector('.task-row[data-task="' + x.t.parentId + '"]'); if (!parentRow) return;
    row.classList.add('is-sub');
    let after = parentRow; while (after.nextElementSibling && after.nextElementSibling.classList.contains('is-sub')) after = after.nextElementSibling;
    after.after(row);
  });
}
document.title = 'ready ' + screen;
</script></body></html>
