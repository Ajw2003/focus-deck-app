<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option B: focus first, side rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;display=swap">
<style>
body{margin:0}
.d{width:1440px;height:900px;box-sizing:border-box;background:radial-gradient(55% 50% at 55% 40%, rgba(242,180,90,.14), transparent 70%), #111829;color:#E9E4D8;font-family:Figtree,system-ui,sans-serif;overflow:hidden;display:flex}
.rail{width:92px;border-right:1px solid #2A3555;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:22px}
.lamp{width:12px;height:12px;border-radius:50%;background:#F2B45A;box-shadow:0 0 14px #F2B45A;margin-bottom:24px}
.ri{width:72px;padding:10px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#9BA3B8;font-size:12px;font-weight:600;text-decoration:none}
.ri.on{background:#212C4A;color:#F2B45A}
.ri svg{width:24px;height:24px}
.dot{position:relative}
.dot b{position:absolute;top:-6px;right:-10px;background:#F2B45A;color:#2A1B05;font-size:10px;border-radius:999px;padding:0 5px}
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:80px}
.q{font-family:'Young Serif',serif;font-size:34px;margin:0}
.sub{color:#9BA3B8;margin:10px 0 34px}
.lbl{width:820px;font-weight:700;font-size:15px;margin:6px 0 2px}
.row{width:820px;display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 26px}
.fold{position:relative;width:150px;height:70px;border-radius:3px 9px 9px 9px;margin-top:10px;padding:12px;box-sizing:border-box}
.fold:before{content:"";position:absolute;left:0;top:-10px;width:50%;height:12px;border-radius:6px 10px 0 0;background:inherit}
.fold span{background:#FFFEFA;color:#1D2733;font:700 14px Figtree,sans-serif;padding:2px 8px;border-radius:2px}
.pick{box-shadow:0 0 0 3px #F2B45A}
.card{width:150px;height:84px;background:#EFEADF;color:#1D2733;border-radius:5px;border-top:6px solid #3E8E5E;padding:10px 10px 10px 22px;box-sizing:border-box;font:700 16px 'Bricolage Grotesque',sans-serif;background-image:linear-gradient(#C9584F,#C9584F);background-size:1.5px 100%;background-position:13px 0;background-repeat:no-repeat}
.card small{display:block;font:400 12px Figtree,sans-serif;color:#4E5A68;margin-top:8px}
</style>
</helmet>
<div class="d">
  <nav class="rail" aria-label="What to do">
    <span class="lamp"></span>
    <a class="ri on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Focus</a>
    <a class="ri" href="#"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h6"/></svg><b>2</b></span>Sort</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="4" height="14"/><rect x="10" y="5" width="4" height="9"/><rect x="16" y="5" width="4" height="12"/></svg>Board</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z"/></svg>Projects</a>
  </nav>
  <div class="main">
    <h1 class="q">What’s your focus right now?</h1>
    <p class="sub">Pick a folder, then a kind of work. You’ll get one task.</p>
    <div class="lbl">Folder</div>
    <div class="row">
      <div class="fold pick" style="background:#E7C98F"><span>All projects</span></div>
      <div class="fold" style="background:#9FC2A6"><span>Home</span></div>
      <div class="fold" style="background:#E3A79F"><span>Website</span></div>
      <div class="fold" style="background:#A9B3CC"><span>School</span></div>
      <div class="fold" style="background:#E3B98A"><span>Portfolio</span></div>
    </div>
    <div class="lbl">Kind of work</div>
    <div class="row">
      <div class="card">Chore<small>5 open · top: High</small></div>
      <div class="card" style="border-top-color:#4D6FB8">Study<small>3 open</small></div>
      <div class="card" style="border-top-color:#C9584F">Bug<small>3 open · top: Urgent</small></div>
      <div class="card" style="border-top-color:#C2731E">Art<small>4 open</small></div>
      <div class="card" style="border-top-color:#E7C98F">Surprise me<small>21 open</small></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
